name: Pokemon Stock Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r poke_bot/requirements.txt

      - name: Check Pokemon stock
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python poke_bot/monitor.py

      - name: Save stock status
        run: |
          if [[ -n "$(git status --porcelain poke_bot/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add poke_bot/state.json
            git commit -m "Update Pokemon stock status"
            git push
          else
            echo "No stock status change."
          fi
